
# ==========================================
# 🌟 Enterprise Extension: YAML Anchors
# ==========================================
x-logging: &gelf-logging
  driver: gelf
  options:
    gelf-address: "udp://${GRAYLOG_HOST}:${GRAYLOG_PORT}"
    tag: "${COMPOSE_PROJECT_NAME}-{{.Name}}"
    labels: "environment,tier"
    env: "production"

services:
  # ==========================================
  # 🗄️ Database Tier (MariaDB)
  # ==========================================
  db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME}_db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_network
    logging: *gelf-logging
    labels:
      tier: "backend"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ==========================================
  # ⚡ Cache Tier (Redis) - น้องใหม่ไฟแรง!
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    restart: unless-stopped
    # บังคับใส่รหัสผ่านเพื่อความปลอดภัยระดับ Enterprise
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file: .env
    networks:
      - wp_network
    logging: *gelf-logging
    labels:
      tier: "cache"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ==========================================
  # 🌐 Application Tier (WordPress)
  # ==========================================
  wordpress:
    depends_on:
      - db
      - redis
    image: wordpress:latest
    container_name: ${COMPOSE_PROJECT_NAME}_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      # ฝังค่า Redis เข้าไปในไฟล์ wp-config.php อัตโนมัติ
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PASSWORD', '${REDIS_PASSWORD}');
    volumes:
      - wp_data:/var/www/html
    networks:
      - wp_network
    logging: *gelf-logging
    labels:
      tier: "frontend"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G

  # ==========================================
  # 🛠️ Management Tier (phpMyAdmin)
  # ==========================================
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    container_name: ${COMPOSE_PROJECT_NAME}_pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      UPLOAD_LIMIT: 300M
    networks:
      - wp_network
    logging: *gelf-logging
    labels:
      tier: "management"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  wp_network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME}_net

volumes:
  db_data:
    name: ${COMPOSE_PROJECT_NAME}_db_data
  wp_data:
    name: ${COMPOSE_PROJECT_NAME}_wp_data
